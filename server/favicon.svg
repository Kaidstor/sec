<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="sec share">
  <style>
    .plate { fill: #0f766e }
    .cut   { fill: #ffffff }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #2dd4bf }
      .cut   { fill: #0d1117 }
    }
  </style>
  <!-- Щит: плоский верх, скруглённые плечи, остриё вниз — читается на 16px -->
  <path class="plate" d="M16 1.6 L28.4 5.6 A1.6 1.6 0 0 1 29.4 7.1 V15.4
    C29.4 22.6 24.2 28.2 16 30.8 C7.8 28.2 2.6 22.6 2.6 15.4 V7.1
    A1.6 1.6 0 0 1 3.6 5.6 Z"/>
  <!-- Замочная скважина = «закрыто», хвост укорочен, чтобы не слипался на мелких размерах -->
  <circle class="cut" cx="16" cy="13.4" r="3.6"/>
  <path class="cut" d="M14.1 16.2 h3.8 l1 6.2 h-5.8 Z"/>
</svg>
